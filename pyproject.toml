[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitest"
version = "0.1.0"
description = "A dependency-free harness for AI prompt and model regression tests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "aitest contributors"}]

[project.scripts]
aitest = "aitest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
